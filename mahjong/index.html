<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台灣麻將 — 16 張</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div id="topbar">
      <h1>台灣麻將</h1>
      <div id="status">準備中...</div>
      <div id="controls">
        <button id="btn-tsumo" class="primary">自摸</button>
        <button id="btn-angang">暗槓</button>
        <button id="btn-win" class="primary">胡</button>
        <button id="btn-pon">碰</button>
        <button id="btn-kan">槓</button>
        <button id="btn-chi">吃</button>
        <button id="btn-pass">過</button>
        <button id="btn-new">新局</button>
      </div>
    </div>
    <canvas id="table"></canvas>

    <div id="result-modal" class="modal" style="display:none;">
      <div class="modal-content">
        <div id="result-body"></div>
      </div>
    </div>
  </div>

  <script src="js/tiles.js"></script>
  <script src="js/win.js"></script>
  <script src="js/tai.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/game.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
